name: Build & push image

# Build the Grocies image on GitHub's hosted runners and push it to GHCR.
# The server never builds — it pulls ghcr.io/<owner>/grocies:latest (Watchtower
# auto-updates it). This replaces the old self-hosted "build on the Pi" deploy.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner (GHCR requires lowercase)
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64        # server.home is x86_64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/grocies:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/grocies:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
